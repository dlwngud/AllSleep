  <path class="line" d="M400 295 H500"/>
  <path class="line" d="M830 295 H930"/>
  <path class="line" d="M1310 295 H1410"/>
  <path class="line" d="M1585 390 V590"/>
  <path class="line" d="M1430 705 H1330"/>
  <path class="line" d="M950 705 H850"/>

