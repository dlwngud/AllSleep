  <rect class="box" x="950" y="200" width="360" height="190" rx="28"/>
  <text class="text" x="1130" y="270">SleepSettings</text>
  <text class="text sub" x="1130" y="335">Repository</text>

  <rect class="box accent" x="1430" y="200" width="310" height="190" rx="28"/>
  <text class="text" x="1585" y="270">Sleep</text>
  <text class="text sub" x="1585" y="335">Scheduler</text>

  <rect class="box" x="1430" y="610" width="310" height="190" rx="28"/>
  <text class="text" x="1585" y="680">Alarm</text>
  <text class="text sub" x="1585" y="745">Manager</text>

  <rect class="box" x="950" y="610" width="360" height="190" rx="28"/>
  <text class="text" x="1130" y="680">Broadcast</text>
  <text class="text sub" x="1130" y="745">Receiver</text>

  <rect class="box accent" x="520" y="610" width="310" height="190" rx="28"/>
