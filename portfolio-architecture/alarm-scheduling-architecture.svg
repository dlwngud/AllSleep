      .text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; font-size: 50px; font-weight: 800; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .sub { font-size: 42px; font-weight: 700; fill: #374151; }
      .note { font-size: 38px; font-weight: 800; fill: #2563eb; }
      .line { stroke: #111827; stroke-width: 7; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke: #2563eb; stroke-width: 7; stroke-dasharray: 18 14; fill: none; marker-end: url(#arrowBlue); stroke-linecap: round; stroke-linejoin: round; }
      .title { font-family: "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; font-size: 58px; font-weight: 900; fill: #111827; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1800" height="980"/>
