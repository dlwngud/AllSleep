<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L16,9 L2,16 Z" fill="#111827"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 5; rx: 28; }
      .accent { fill: #eef6ff; stroke: #2563eb; }
      .text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; font-size: 50px; font-weight: 800; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .sub { font-size: 42px; font-weight: 700; fill: #374151; }
      .line { stroke: #111827; stroke-width: 7; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .title { font-family: "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; font-size: 58px; font-weight: 900; fill: #111827; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1800" height="980"/>
  <text class="title" x="900" y="90">수면 모드 유지 및 차단 화면 복구 구조</text>

  <rect class="box accent" x="90" y="210" width="330" height="190" rx="28"/>
  <text class="text" x="255" y="280">사용자</text>
  <text class="text sub" x="255" y="345">수면 모드 시작</text>

  <rect class="box" x="560" y="210" width="360" height="190" rx="28"/>
  <text class="text" x="740" y="280">수면 상태</text>
  <text class="text sub" x="740" y="345">Firestore 업데이트</text>

  <rect class="box" x="1060" y="210" width="330" height="190" rx="28"/>
  <text class="text" x="1225" y="280">Foreground</text>
  <text class="text sub" x="1225" y="345">Service 유지</text>

  <rect class="box accent" x="1410" y="595" width="330" height="210" rx="28"/>
  <text class="text" x="1575" y="665">WindowManager</text>
  <text class="text sub" x="1575" y="735">Overlay 표시</text>

  <rect class="box" x="190" y="595" width="420" height="210" rx="28"/>
  <text class="text" x="400" y="665">Accessibility</text>
  <text class="text sub" x="400" y="735">다른 앱 실행 감지</text>

  <rect class="box" x="760" y="595" width="360" height="210" rx="28"/>
  <text class="text" x="940" y="665">차단 화면</text>
  <text class="text sub" x="940" y="735">즉시 복구</text>

  <path class="line" d="M420 305 H540"/>
  <path class="line" d="M920 305 H1040"/>
  <path class="line" d="M1225 400 V520 H1575 V575"/>
  <path class="line" d="M610 700 H740"/>
  <path class="line" d="M1120 700 H1390"/>
</svg>
