  <rect class="box" x="980" y="195" width="330" height="200" rx="28"/>
  <text class="text" x="1145" y="265">Foreground</text>
  <text class="text sub" x="1145" y="330">GeofenceService</text>

  <rect class="box accent" x="1430" y="195" width="330" height="200" rx="28"/>
  <text class="text" x="1595" y="265">Geofencing</text>
  <text class="text sub" x="1595" y="330">Client 등록</text>

  <rect class="box" x="1430" y="605" width="330" height="210" rx="28"/>
  <text class="text" x="1595" y="675">진입 / 이탈</text>
  <text class="text sub" x="1595" y="745">PendingIntent</text>

  <rect class="box" x="925" y="605" width="440" height="210" rx="28"/>
  <text class="text" x="1145" y="675">BroadcastReceiver</text>
  <text class="text sub" x="1145" y="745">위치 이벤트 수신</text>

  <rect class="box accent" x="430" y="605" width="370" height="210" rx="28"/>
  <text class="text" x="615" y="675">알람 실행</text>
  <text class="text sub" x="615" y="745">소리 / 진동 / 알림</text>

  <rect class="box" x="80" y="605" width="260" height="210" rx="28"/>
  <text class="text" x="210" y="675">해제 화면</text>
  <text class="text sub" x="210" y="745">CloseActivity</text>

  <path class="line" d="M410 295 H510"/>
  <path class="line" d="M860 295 H960"/>
  <path class="line" d="M1310 295 H1410"/>
  <path class="line" d="M1595 395 V585"/>
  <path class="line" d="M1430 710 H1385"/>
  <path class="line" d="M925 710 H820"/>
  <path class="line" d="M430 710 H360"/>

  <path class="dash" d="M1145 395 C1145 490, 1330 505, 1595 420"/>
  <text class="text note" x="1340" y="505">Notification으로 백그라운드 유지</text>
